general {
        colors = false
        interval = 5
}

order += "volume master"
order += "wireless _first_"
order += "ethernet _first_"
order += "disk /"
order += "memory"
order += "tztime local"

wireless _first_ {
        format_up = "W: %essid"
        format_down = "W: down"
}

ethernet _first_ {
        format_up = "E: %ip (%speed)"
        format_down = "E: down"
}

disk "/" {
        format = "Porn folder: %used / %total"
}

memory {
        format = "ram: %used / %total"
        threshold_degraded = "1G"
        format_degraded = "MEMORY < %available"
}

tztime local {
        format = "%d-%m-%Y %H:%M"
}

volume master {
	format = "vol: %volume"
	format_muted = "vol: muted"
	device = "default"
	mixer = "master"
	mixer_idx = 0
}
